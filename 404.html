<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS general -->
    <link rel="stylesheet" href="assets/css/index.css" />
  </head>

  <body class="error-page">
    <div class="custom-cursor"></div>

    <!-- ERROR SECTION -->
    <section class="error-section">
      <div class="error-content">
        <h1 class="error-number">404</h1>
        <h2 class="error-title">Oops! Page not found</h2>
        <p class="error-text">
          The page you're looking for doesn't exist or has been moved.
          <br />
          Let's get you back on track.
        </p>

        <div class="error-buttons">
          <a href="./index.html" class="error-btn error-btn-primary">
            Back to Home
            <img
              src="assets/img/flecha_blanco.png"
              alt=""
              class="error-btn-icon"
            />
          </a>
          <a href="./projects.html" class="error-btn error-btn-secondary">
            View Projects
          </a>
        </div>
      </div>

      <!-- Decoración con formas orgánicas -->
      <div class="error-decoration">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
      </div>
    </section>

    <footer class="site-footer">
      <p>© 2025 Ana Callejón Alén</p>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
